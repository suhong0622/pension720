name: Update pension720 data

on:
  schedule:
    # 매주 목요일 UTC 11:05 = 한국시간(KST) 20:05
    # 연금복권720+ 추첨은 매주 목요일 19:05(KST)라, 결과 반영 시간을 넉넉히 잡았어요.
    - cron: "5 11 * * 4"
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/win720.js
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 연금복권720+ 최신 회차 자동 반영"
            git push
          fi
